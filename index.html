<style>
  :root {

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  button, input { font: inherit; }
  .wrap { max-width: 40rem; margin: 0 auto; padding: 1rem 1rem 4rem; }
  .kicker {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brand);
    margin: 0.4rem 0 0.3rem;

  h1 { font-size: 2.1rem; font-weight: 500; margin: 0; letter-spacing: -0.02em; }

  .hint { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.78rem; }
  .sticky {
    position: sticky;
    top: 0;
    z-index: 2;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    padding: 0.6rem 0 0.7rem;
    margin: 0 -1rem;
    padding-left: 1rem;
    padding-right: 1rem;
  }
  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--surface);

    padding: 0.7rem 0.8rem;

    width: 100%;
    border: 0;

    font-size: 1rem;
    outline: none;

  .chip {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 0.45rem 0.75rem;
    white-space: nowrap;
    font-size: 0.8rem;
  }
  .chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 700; }
  .copy {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 0.4rem 0.65rem;
    font-size: 0.78rem;
  }
  .count { font-family: ui-sans-serif, system-ui, sans-serif; color: var(--faint); font-size: 0.78rem; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.7rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .card-btn { width: 100%; text-align: left; background: transparent; color: inherit; border: 0; padding: 0.9rem 1rem; }
  .name-row { display: flex; justify-content: space-between; gap: 0.7rem; align-items: flex-start; }
  .name { font-size: 1.15rem; }
  .badge {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--brand-soft);
    color: var(--brand);
    border-radius: 999px;
    padding: 0.2rem 0.45rem;
    white-space: nowrap;
  }
  .summary { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.92rem; margin-top: 0.35rem; }
  .body { border-top: 1px solid var(--line); padding: 0.9rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .label {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 0.25rem;
  }
  .body p { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.95rem; }
  .majors { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
  .major {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 0.75rem;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 0.15rem 0.5rem;
  }

  .empty {
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 1.5rem 1rem;
    text-align: center;
    color: var(--muted);
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .label-row { display: flex; justify-content: space-between; align-items: center; }
</style>

<script>
const DATA = JSON.parse(document.getElementById("shpe-data").textContent);
const companies = DATA.companies;
const OPT = document.getElementById("opt-line").textContent;
const counts = {
  cs: companies.filter((c) => c.hiresCs).length,
  ce: companies.filter((c) => c.hiresCs || c.hiresCompE).length,
  all: companies.length,
};
document.getElementById("lede").textContent =
  counts.cs + " companies in the SHPE-UF database list computer science. Search the booth, open the card, then read the two lines out loud.";

let filter = "cs";
let openId = null;
const qEl = document.getElementById("q");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const chipsEl = document.getElementById("chips");

function chip(id, label) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip" + (filter === id ? " on" : "");
  b.textContent = label;
  b.onclick = () => { filter = id; drawChips(); render(); };
  chipsEl.appendChild(b);
}
function drawChips() {
  chipsEl.replaceChildren();
  chip("cs", "Computer science · " + counts.cs);
  chip("ce", "CS or CompE · " + counts.ce);
  chip("all", "Every employer · " + counts.all);
}

async function copyText(text, button) {
  const prev = button.textContent;
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = "Copied";
  } catch {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    button.textContent = "Copied";
  }
  setTimeout(() => { button.textContent = prev; }, 1400);
}
document.getElementById("copy-opt").onclick = (e) => copyText(OPT, e.currentTarget);

function visible() {
  const q = qEl.value.trim().toLowerCase();
  return companies.filter((c) => {
    if (filter === "cs" && !c.hiresCs) return false;
    if (filter === "ce" && !c.hiresCs && !c.hiresCompE) return false;
    if (!q) return true;
    return (c.name + " " + c.summary + " " + c.projects + " " + c.majors.join(" ")).toLowerCase().includes(q);
  });
}

function block(label, body, withCopy) {
  const wrap = document.createElement("div");
  const row = document.createElement("div");
  row.className = "label-row";
  const lab = document.createElement("p");
  lab.className = "label";
  lab.textContent = label;
  row.appendChild(lab);
  if (withCopy) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "copy";
    b.textContent = "Copy";
    b.onclick = () => copyText(withCopy, b);
    row.appendChild(b);
  }
  const p = document.createElement("p");
  p.textContent = body;
  wrap.append(row, p);
  return wrap;
}

function render() {
  const rows = visible();

  countEl.textContent = rows.length + (rows.length === 1 ? " employer" : " employers") + (q ? " matching “" + q + "”" : "");

    btn.type = "button";
    btn.className = "card-btn";
    btn.setAttribute("aria-expanded", openId === company.id ? "true" : "false");
    const row = document.createElement("div");
    row.className = "name-row";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = company.name;
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = company.hiresCs ? "CS" : company.hiresCompE ? "CompE" : "Other";
    row.append(name, badge);
    const summary = document.createElement("div");
    summary.className = "summary";
    summary.textContent = company.summary;
    btn.append(row, summary);
    btn.onclick = () => { openId = openId === company.id ? null : company.id; render(); };
    li.appendChild(btn);
    if (openId === company.id) {
      const body = document.createElement("div");
      body.className = "body";
      body.appendChild(block("Say this", company.say, company.say + " " + company.ask));
      body.appendChild(block("Then ask", company.ask));
      if (company.projects) body.appendChild(block("What they’re doing", company.projects));
      const majorsWrap = document.createElement("div");
      const lab = document.createElement("p");
      lab.className = "label";
      lab.textContent = "Majors they listed";
      const majors = document.createElement("div");
      majors.className = "majors";
      for (const major of company.majors) {
        const m = document.createElement("span");
        m.className = "major" + (/computer science/i.test(major) ? " cs" : "");
        m.textContent = major;
        majors.appendChild(m);
      }
      majorsWrap.append(lab, majors);
      const page = document.createElement("p");
      page.className = "hint";
      page.textContent = "Database page " + company.page;
      body.append(majorsWrap, page);
      li.appendChild(body);
    }
    listEl.appendChild(li);
  }
}
qEl.addEventListener("input", render);
drawChips();
render();
</script>
</body>
</html>
